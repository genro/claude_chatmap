<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatmap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column for the side pane; topics grid on top (own scroll), turns grid below. */
:root{
  --bg:#f6f5f1; --surface:#fbfaf7; --panel:#efede6; --fg:#1b1b19; --muted:#6e6c66; --line:#dedbd2;
  --accent:#b4532a; --gold:#a8791e; --pend:#2a6fa8; --ok:#2f6f4f; --bad:#b3261e; --chip:#e8e5dc;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141413; --surface:#1b1a18; --panel:#24221e; --fg:#ecebe6; --muted:#a19e95; --line:#34312c;
  --accent:#e08a5f; --gold:#d6a94a; --pend:#7fb2e8; --ok:#6fbf95; --bad:#f08a80; --chip:#2c2a25; color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit}

header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{font-weight:700}
.where{font:.75rem var(--mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.live.off{background:var(--muted)}
.btn{border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.section{font:600 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px;display:flex;align-items:center;gap:8px}
.section .sp{flex:1}
.section label{font:500 .72rem var(--sans);letter-spacing:0;text-transform:none;display:flex;align-items:center;gap:4px;cursor:pointer}

.topics{max-height:38vh;overflow-y:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) 30px 18px;gap:8px;align-items:start;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--panel)}
.trow.sel{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.code{font:600 .72rem var(--mono);border-radius:4px;padding:1px 0;text-align:center;color:#fff}
.code.plain{color:var(--muted);background:var(--chip)}
.trow .t{font-weight:600;overflow-wrap:anywhere}
.trow .d{display:block;color:var(--muted);font-size:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.edit{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:.85rem}
.edit:hover{color:var(--fg)}
.trow.editing{cursor:default;background:var(--panel)}
.trow.editing input,.trow.editing textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--surface);font:inherit;color:var(--fg);margin-bottom:4px;resize:vertical}
.trow.editing .et{font-weight:600}
.eb{display:flex;gap:6px}
.trow .c{font:600 .8rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.star{font:500 .62rem var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px}

.filter{padding:0 10px 6px}
.filter input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);font:inherit;color:var(--fg)}

.turns{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:var(--lanes) minmax(0,1fr) auto 18px;gap:6px;align-items:center;padding:2px 10px;border-bottom:1px solid var(--line)}
.lrow .r{font:.66rem var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow .r .x{color:var(--bad)}
.lrow:hover{background:var(--panel)}
.lrow.open{background:var(--panel)}
.lrow .n{font:500 .72rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.lrow .q{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.open .q,.lrow .q.wrap{white-space:normal}
.lrow .q.run{color:var(--accent)}
.pend{color:var(--pend);font-weight:500}
.lrow .q.old{}
.lrow .q.raw{font-weight:500;color:var(--pend)}
.toggle{border:1px solid var(--line);border-radius:4px;background:var(--surface);width:18px;height:18px;padding:0;cursor:pointer;font-size:.75rem;color:var(--muted)}
.toggle:hover{border-color:var(--muted);color:var(--fg)}
.more .full{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:6px}
.more .lbl{font:600 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
.tag{font:600 .68rem var(--mono);text-align:center;border-radius:4px;padding:1px 4px;color:#fff;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.who .n{display:block}
.who .none{font:.68rem var(--mono);color:var(--bad)}
.state{font:.68rem var(--mono);border-radius:9px;padding:0 6px;border:1px solid currentColor}
.state.go{cursor:pointer;background:none;font:.68rem var(--mono)}
.state.go:hover{background:var(--pend);color:var(--bg)}
.state.run{color:var(--accent)} .state.wait{color:var(--gold)} .state.bad{color:var(--bad)}
.meta{font:.68rem var(--mono);color:var(--muted)}
.more{display:none;grid-column:2 / -1;margin:4px 0 6px}
.lrow.open .more{display:block}
.more .o{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg);border-left:2px solid var(--line);padding-left:8px}
.more .ph{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.more .pq{white-space:pre-wrap;overflow-wrap:anywhere}
.more .pa{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem}
.agree{color:var(--ok)} .disagree{color:var(--bad)}
.empty{padding:14px 10px;color:var(--muted)}
.usage{font:.68rem var(--mono);color:var(--muted);padding:4px 10px;border-bottom:1px solid var(--line)}
.usage:empty{display:none}
.lanes{display:flex;align-self:stretch;margin:-2px 0}
.lanes{border-left:1px solid var(--line)}
.lane{width:16px;flex:none;display:flex;border-right:1px solid var(--line)}
.lane i{display:flex;align-items:center;justify-content:center;width:100%;font:600 .6rem var(--mono);color:#fff;font-style:normal}
.lanehead{display:grid;grid-template-columns:var(--lanes) minmax(0,1fr);gap:6px;padding:3px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.lanehead .lanes{margin:0}
.lanehead .lane{justify-content:center;font:600 .6rem var(--mono);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <span class="live" id="live"></span>
  <span class="brand">chatmap</span>
  <span class="where" id="where"></span>
  <button class="btn dark" id="reorganise" title="Reorganise the latest turns now">↻</button>
  <button class="btn" id="rebuild" title="Rebuild topics, blocks and labels from the whole conversation">Rebuild</button>
</header>
<div class="usage" id="usage"></div>

<div class="section">Topics <span class="sp"></span><span id="counts"></span></div>
<div class="topics" id="topics"></div>

<div class="section"><span id="turnsTitle">Turns</span><span class="sp"></span><label><input type="checkbox" id="cluster"> Cluster</label></div>
<div class="filter"><input id="filter" type="search" placeholder="Filter…"></div>
<div class="turns" id="turns"></div>

<script>
class Grid {
  constructor(data) {
    this.topic = "all";
    this.query = "";
    this.cluster = false;
    this.open = new Set();
    this.palette = ["#2f6f4f","#b4532a","#5a55a8","#a8791e","#2a6fa8","#a8327a","#4f8a2a","#7a5230","#2a8a8a","#8a2a2a"];
    this.setData(data);
  }

  setData(data) {
    this.data = data;
    this.ids = Object.keys(data.topics);
    this.byN = Object.fromEntries(data.physical.map(p => [p.n, p]));
    const last = data.logical.length ? data.logical[data.logical.length - 1].physical : [0];
    const covered = last[last.length - 1];
    const provisional = data.physical.filter(p => p.n > covered).map(p => ({
      physical: [p.n], prompt: p.prompt, outcome: p.state === "running" ? "" : p.answer,
      topics: p.user ? [p.user] : p.haiku, provisional: p.state || "placed",
    }));
    this.turns = [...data.logical, ...provisional];
  }

  esc(t) { return String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  color(id) { return this.palette[this.ids.indexOf(id) % this.palette.length]; }
  code(id) { return id.toUpperCase(); }
  title(id) { return this.data.topics[id] ? this.data.topics[id].title : id; }
  range(ns) { return ns.length === 1 ? `#${ns[0]}` : `#${ns[0]}–${ns[ns.length - 1]}`; }
  tag(id) { return `<span class="tag" style="background:${this.color(id)}" title="${this.esc(this.title(id))}">${this.code(id)}</span>`; }
  badge(id) { return `<span class="tag" style="background:${this.color(id)}">${this.esc(this.title(id))}</span>`; }
  count(id) { return this.turns.filter(l => l.topics.includes(id)).length; }

  state(l) {
    if (!l.provisional) return "";
    const map = { running: ["run", "running"], queued: ["wait", "classifying"], placed: ["pend", "awaiting reorganisation"], unclassified: ["bad", "unclassified"] };
    const [cls, text] = map[l.provisional];
    if (l.provisional === "placed") return `<button class="state pend go" title="Reorganise now">${this.busy ? "reorganising…" : text + " ↻"}</button>`;
    return `<span class="state ${cls}">${text}</span>`;
  }

  pendingCount(group) {
    const n = group.filter(l => l.provisional).length;
    return n ? `<button class="state pend go" title="Reorganise now">${this.busy ? "reorganising…" : `${n} awaiting reorganisation ↻`}</button>` : "";
  }

  classifier(l) {
    const placed = l.physical.map(n => this.byN[n]).filter(p => p && !p.short && !p.user);
    const sure = placed.filter(p => p.haiku.length);
    if (l.provisional || !sure.length) return "";
    const agree = sure.filter(p => p.haiku.every(id => l.topics.includes(id))).length;
    return agree === sure.length ? `<span class="meta agree">classifier ✓</span>` : `<span class="meta disagree">classifier ✗ ${sure.length - agree}</span>`;
  }

  visible() {
    const q = this.query.toLowerCase();
    return this.turns.filter(l => {
      if (this.topic === "none" && l.topics.length) return false;
      if (this.topic !== "all" && this.topic !== "none" && !l.topics.includes(this.topic)) return false;
      return !q || (l.prompt + " " + l.outcome + " " + l.physical.join(" ")).toLowerCase().includes(q);
    });
  }

  groups() {
    const list = this.visible();
    if (!this.cluster) return list.map(l => [l]);
    const out = [];
    for (const l of list) {
      const prev = out[out.length - 1];
      const last = prev && prev[prev.length - 1];
      const adjacent = last && this.turns[this.turns.indexOf(l) - 1] === last;
      if (adjacent && l.block && last.block === l.block) prev.push(l);
      else out.push([l]);
    }
    return out;
  }

  send(action) {
    return fetch("/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(action) });
  }

  drawHeader() {
    const d = this.data;
    document.getElementById("live").className = d.live ? "live" : "live off";
    document.getElementById("where").textContent = `${d.title} · ${d.session.slice(0, 8)}`;
    const k = n => (n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
    const spent = Object.entries(d.usage || {}).map(([model, u]) =>
      `${model} ${u.calls} calls · ${k(u.input + u.cacheRead + u.cacheWrite)} in · ${k(u.output)} out`);
    document.getElementById("usage").textContent = spent.length ? `Tokens · ${spent.join(" | ")}` : "";
    document.getElementById("counts").textContent = `${d.logical.length} logical · ${d.physical.length} physical`;
  }

  drawTopics() {
    const none = this.turns.filter(l => !l.topics.length).length;
    const row = (key, code, title, desc, n) => `<div class="trow${this.topic === key ? " sel" : ""}" data-topic="${key}">
      ${code}<div><span class="t">${title}</span>${desc ? `<span class="d">${desc}</span>` : ""}</div><span class="c">${n}</span>
      ${this.ids.includes(key) && location.protocol.startsWith("http") ? `<button class="edit" title="Edit title and description">✎</button>` : "<span></span>"}</div>`;
    const editor = id => `<div class="trow editing" data-topic="${id}"><span class="code" style="background:${this.color(id)}">${this.code(id)}</span>
      <div><input class="et" value="${this.esc(this.title(id)).replace(/"/g, "&quot;")}" placeholder="Title">
      <textarea class="ed" rows="2" placeholder="Description">${this.esc(this.data.topics[id].description)}</textarea>
      <div class="eb"><button class="btn dark save">Save</button><button class="btn cancel">Cancel</button></div></div><span></span><span></span></div>`;
    const rows = [row("all", '<span class="code plain">ALL</span>', "All turns", "", this.turns.length)];
    for (const id of this.ids) {
      const t = this.data.topics[id];
      const star = id === this.data.primary ? '<span class="star">primary</span>' : "";
      const fixed = t.fixed ? '<span class="star" title="Edited by you: the reorganiser keeps it">edited</span>' : "";
      rows.push(this.editing === id ? editor(id) : row(id, `<span class="code" style="background:${this.color(id)}">${this.code(id)}</span>`, this.esc(t.title) + star + fixed, this.esc(t.description), this.count(id)));
    }
    if (none) rows.push(row("none", '<span class="code plain">?</span>', "Unclassified", "", none));
    document.getElementById("topics").innerHTML = rows.join("");
  }

  drawTurns() {
    document.getElementById("turnsTitle").textContent =
      this.topic === "all" ? "Turns" : this.topic === "none" ? "Turns · unclassified" : `Turns · ${this.code(this.topic)}`;
    const turnsBox = document.getElementById("turns");
    turnsBox.style.setProperty("--lanes", `${Math.max(1, this.ids.length) * 16}px`);
    const rows = [`<div class="lanehead"><div class="lanes">${this.ids.map(id => `<span class="lane" title="${this.esc(this.title(id))}">${id.slice(1)}</span>`).join("")}</div><span class="meta">topics</span></div>`];
    rows.push(...this.groups().map(group => this.turnRow(group)));
    document.getElementById("turns").innerHTML = rows.join("") || '<div class="empty">No turns.</div>';
  }

  turnRow(group) {
      const first = group[0];
      const key = first.physical[0];
      const ns = group.flatMap(l => l.physical);
      const topics = [...new Set(group.flatMap(l => l.topics))];
      const more = group.map(l => `${group.length > 1 ? `<div class="lbl">${this.range(l.physical)} · ${this.esc(l.label || "")}</div>` : ""}<div class="lbl">Request</div><div class="full">${this.esc(l.prompt)}</div><div class="lbl">Outcome</div><div class="o">${this.esc(l.outcome) || "—"}</div>`).join("") + '<div class="lbl">Physical turns</div>' +
        ns.map(n => {
          const p = this.byN[n];
          const said = p.short ? "short" : p.haiku.length ? "classifier: " + p.haiku.map(id => this.code(id)).join(", ") : "classifier: not sure";
          return `<div class="ph"><div class="meta">#${n} · ${said} · ${this.esc(p.tools.join(", ")) || "no tools"}</div>
            <div class="pq">${this.esc(p.prompt)}</div><div class="pa">${this.esc(p.answer)}</div></div>`;
        }).join("");
      const short = l => this.esc(l.prompt.length > 60 ? l.prompt.slice(0, 59) + "…" : l.prompt);
      const text = group.length === 1
        ? (first.label ? `<div class="q">${this.esc(first.label)}</div>` : `<div class="q ${first.provisional ? "raw" : "old"}">${this.esc(first.prompt)}</div>`)
        : `<div class="q wrap">${group.map(l => (l.label ? this.esc(l.label) : l.provisional ? `<span class="pend">${short(l)}</span>` : short(l))).join(" · ")}</div>`;
      const isOpen = this.open.has(key);
      const cls = first.provisional === "running" ? "run" : "";
      const flag = this.classifier(first).includes("disagree") ? '<span class="x" title="classifier disagreed">✗ </span>' : "";
      return `<div class="lrow${isOpen ? " open" : ""}" data-key="${key}">
        <div class="lanes">${this.ids.map(id => `<span class="lane">${topics.includes(id) ? `<i style="background:${this.color(id)}" title="${this.esc(this.title(id))}">${id.slice(1)}</i>` : ""}</span>`).join("")}</div>
        <div class="${cls}" title="${this.esc(group.length > 1 ? first.block : first.label || first.prompt)}">${text}</div>
        <span class="r">${flag}${this.range(ns)}</span>
        <button class="toggle" title="${isOpen ? "Hide" : "Show"} the full text">${isOpen ? "▾" : "▸"}</button>
        <div class="more">${more}</div></div>`;
  }

  draw() { this.drawHeader(); this.drawTopics(); this.drawTurns(); }

  bind() {
    const live = location.protocol.startsWith("http");
    document.getElementById("reorganise").disabled = !live;
    document.getElementById("reorganise").addEventListener("click", e => {
      e.currentTarget.disabled = true;
      this.busy = true;
      this.send({ kind: "reorganise" });
      this.drawTurns();
    });
    const rebuild = document.getElementById("rebuild");
    rebuild.disabled = !live;
    rebuild.addEventListener("click", () => {
      if (rebuild.dataset.armed !== "1") {
        rebuild.dataset.armed = "1";
        rebuild.textContent = "Rebuild? click again";
        setTimeout(() => { rebuild.dataset.armed = ""; rebuild.textContent = "Rebuild"; }, 4000);
        return;
      }
      rebuild.dataset.armed = "";
      rebuild.textContent = "rebuilding…";
      rebuild.disabled = true;
      this.send({ kind: "rebuild" });
    });
    document.getElementById("topics").addEventListener("click", e => {
      const row = e.target.closest(".trow"); if (!row) return;
      if (e.target.closest(".edit")) { this.editing = row.dataset.topic; this.drawTopics(); row.parentElement.querySelector(".et")?.focus(); return; }
      if (row.classList.contains("editing")) {
        if (e.target.closest(".cancel")) { this.editing = null; this.drawTopics(); }
        if (e.target.closest(".save")) {
          const title = row.querySelector(".et").value.trim();
          const description = row.querySelector(".ed").value.trim();
          if (!title) return;
          this.send({ kind: "edit", id: row.dataset.topic, title, description });
          this.data.topics[row.dataset.topic] = { title, description, fixed: true };
          this.editing = null; this.draw();
        }
        return;
      }
      this.topic = row.dataset.topic; this.drawTopics(); this.drawTurns();
      document.getElementById("turns").scrollTop = 0;
    });
    document.getElementById("turns").addEventListener("click", e => {
      if (e.target.closest(".go")) {
        if (!this.busy && location.protocol.startsWith("http")) { this.busy = true; this.send({ kind: "reorganise" }); this.drawTurns(); }
        return;
      }
      const button = e.target.closest(".toggle"); if (!button) return;
      const key = Number(button.closest(".lrow").dataset.key);
      if (this.open.has(key)) this.open.delete(key); else this.open.add(key);
      this.drawTurns();
    });
    document.getElementById("filter").addEventListener("input", e => { this.query = e.target.value; this.drawTurns(); });
    document.getElementById("cluster").addEventListener("change", e => { this.cluster = e.target.checked; this.drawTurns(); });
  }
}

const EMPTY = { live: true, session: "", title: "waiting for the first turn", primary: "", topics: {}, logical: [], physical: [], models: {}, agreement: {} };
const DATA = /*DATA*/null;
const grid = new Grid(DATA || EMPTY);
grid.bind();
grid.draw();
if (location.protocol.startsWith("http")) {
  const events = new EventSource("/events");
  events.addEventListener("state", e => {
    grid.setData(JSON.parse(e.data));
    grid.busy = false;
    const rebuild = document.getElementById("rebuild");
    if (rebuild.textContent === "rebuilding…") { rebuild.textContent = "Rebuild"; rebuild.disabled = false; }
    grid.draw();
    document.getElementById("reorganise").disabled = false;
  });
  events.onerror = () => { document.getElementById("live").className = "live off"; };
  events.onopen = () => { document.getElementById("live").className = "live"; };
}
</script>
</body>
</html>
