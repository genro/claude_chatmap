<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sourcerer-link</title>
<style>
:root { --bg: #ffffff; --fg: #1f2328; --dim: #656d76; --line: #d0d7de; --on: #1a7f37; --row: #f6f8fa; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161616; --fg: #e6edf3; --dim: #8b949e; --line: #30363d; --on: #3fb950; --row: #1f1f1f; }
}
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
h1 { font-size: 16px; margin: 0 0 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:hover td { background: var(--row); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
a { color: inherit; text-decoration: none; font-weight: 600; }
.cwd { color: var(--dim); font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; }
.dot.on { background: var(--on); }
.empty { color: var(--dim); }
</style>
</head>
<body>
<h1>Chats</h1>
<table>
  <thead><tr><th>Chat</th><th>Topics</th><th>Logical</th><th>Physical</th><th>Pages</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const DATA = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function draw(list) {
  const rows = document.getElementById("rows");
  if (!list.length) { rows.innerHTML = `<tr><td colspan="5" class="empty">No chat has posted a map yet.</td></tr>`; return; }
  rows.innerHTML = list
    .sort((a, b) => Number(b.enabled) - Number(a.enabled) || a.title.localeCompare(b.title))
    .map(s => `<tr>
      <td><span class="dot ${s.enabled ? "on" : ""}" title="${s.enabled ? "on" : "off"}"></span><a href="/s/${esc(s.id)}/">${esc(s.title)}</a>
        <div class="cwd">${esc(s.cwd || s.id)}</div></td>
      <td class="num">${s.topics}</td><td class="num">${s.logical}</td><td class="num">${s.physical}</td><td class="num">${s.pages}</td>
    </tr>`).join("");
}
draw(DATA || []);
setInterval(() => fetch("/sessions").then(r => r.json()).then(draw), 5000);
</script>
</body>
</html>
